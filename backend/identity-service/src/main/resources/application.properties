# Servisin Eureka'da kullanılacak adı
spring.application.name=identity-service

# Yerel çalışma adresi ve portu
server.address=127.0.0.1
server.port=8081

# Eureka sunucusunun adresi
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Kendini kaydet ve diğer servislerin kayıtlarını al
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Sağlık durumunu Eureka kaydına yansıt
eureka.client.healthcheck.enabled=true

# Diğer yerel servislerin erişebileceği adresi duyur
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Sağlık ve bilgi adresleri
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info

# Dışarı sunulan yönetim endpoint'leri
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never