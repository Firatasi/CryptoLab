# Servisin Eureka'da kullanılacak adı
spring.application.name=identity-service

# Yerel çalışma adresi ve portu
server.address=127.0.0.1
server.port=8081

# Eureka sunucusunun adresi
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Kendini kaydet ve diğer servislerin kayıtlarını al
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Sağlık durumunu Eureka kaydına yansıt
eureka.client.healthcheck.enabled=true

# Diğer yerel servislerin erişebileceği adresi duyur
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Sağlık ve bilgi adresleri
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info

# Dışarı sunulan yönetim endpoint'leri
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Identity veritabanı
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=identity_db
spring.flyway.schemas=identity_db
spring.flyway.create-schemas=false

# JPA kullanılırsa otomatik tablo değişikliği yapma
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=public

# DTO'da olmayan JSON alanlarını reddet
spring.jackson.deserialization.fail-on-unknown-properties=true

# JWT üretimi
jwt.issuer=${JWT_ISSUER:http://localhost:8081}
jwt.audience=${JWT_AUDIENCE:cryptolab-api}
jwt.kid=${JWT_KID:dev-2026-01}
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}

# Register idempotency isteğinin HMAC anahtarı
registration.hash-key=${REGISTRATION_HASH_KEY}

# Downstream servislerin public key alacağı sabit adres
jwt.jwks-url=${JWT_JWKS_URL:http://localhost:8081/.well-known/jwks.json}

# Refresh/logout için izinli frontend origin
web.origin=${WEB_ORIGIN:http://localhost:5173}

# HTTPS ortamında cookie yalnız güvenli bağlantıyla gönderilir
cookie.secure=${COOKIE_SECURE:true}

# Yerel kullanımda istemcinin forwarded başlıklarını adres olarak kabul etme
server.forward-headers-strategy=none