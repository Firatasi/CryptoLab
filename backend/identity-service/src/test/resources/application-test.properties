# PostgreSQL: aynı veritabanı, ayrı test şeması
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=identity_test_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Test migration'ları yalnızca test şemasına uygulanır
spring.flyway.enabled=true
spring.flyway.default-schema=identity_test_db
spring.flyway.schemas=identity_test_db
spring.flyway.create-schemas=true

# Testlerde servis keşfi kapalı
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

registration.hash-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
jwt.private-key-path=/keys/private.pem
jwt.public-key-path=/keys/public.pem
