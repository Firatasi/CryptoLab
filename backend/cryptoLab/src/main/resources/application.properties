spring.application.name=cryptoLab

# PostgreSQL veritabani baglanti ayarlari (LOCAL)
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=2002
spring.jpa.properties.hibernate.default_schema=crypto_lab
server.port=8080

# PostgreSQL driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Entity siniflarina gore tablolari otomatik gunceller
spring.jpa.hibernate.ddl-auto=update

# SQL sorgularini konsolda gosterir
spring.jpa.show_sql=true
# SQL ciktisini daha okunabilir hale getirir
spring.jpa.properties.hibernate.format_sql=true

# Hibernate'in PostgreSQL'e uygun SQL uretmesini saglar
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# API hata mesajlar?nda gereksiz stack trace d�nmesini engeller.
spring.web.error.include-stacktrace=never

# Validation hatalarinda mesajlarin d�nebilmesi i�in.
spring.web.error.include-message=always


# ===============================
# OpenAPI / Swagger
# ===============================

# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html

# OpenAPI JSON path
springdoc.api-docs.path=/v3/api-docs

# Swagger UI i�inde endpointleri tag/path s?ras?na g�re d�zenler.
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# JWT authorize bilgisini sayfa yenilenince korur.
springdoc.swagger-ui.persist-authorization=true