# Servisin Eureka'da kullanılacak adı
spring.application.name=api-gateway

# Yerel çalışma adresi ve portu
server.address=127.0.0.1
server.port=8080

# Eureka sunucusunun adresi
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Kendini kaydet ve diğer servislerin kayıtlarını al
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Sağlık durumunu Eureka kaydına yansıt
eureka.client.healthcheck.enabled=true

# Diğer yerel servislerin erişebileceği adresi duyur
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Sağlık ve bilgi adresleri
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info

# Dışarı sunulan yönetim endpoint'leri
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false

# Eureka'nın tuttuğu kayıt önbelleği kullanılır
spring.cloud.loadbalancer.cache.enabled=false

# Otomatik yeniden deneme kapalı
spring.cloud.loadbalancer.retry.enabled=false

# Whitelabel HTML hata sayfasını ve iç detay sızıntısını devre dışı bırak
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

# Gateway güvenlik ve hız sınırlama ayarları
app.gateway.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}
app.gateway.frontend-url=${APP_WEB_ORIGIN:}
app.gateway.rate-limit.enabled=${GATEWAY_RATE_LIMIT_ENABLED:true}
app.gateway.rate-limit.auth-per-minute=${GATEWAY_AUTH_RATE_LIMIT:60}
app.gateway.rate-limit.general-per-minute=${GATEWAY_GENERAL_RATE_LIMIT:600}
