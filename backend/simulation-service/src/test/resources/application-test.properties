# PostgreSQL: aynı veritabanı, ayrı test şeması
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=simulation_test_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Test migration'ları yalnızca test şemasına uygulanır
spring.flyway.enabled=true
spring.flyway.default-schema=simulation_test_db
spring.flyway.schemas=simulation_test_db
spring.flyway.create-schemas=true

# JPA kullanılırsa test şemasını doğrula
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=simulation_test_db

# Testlerde servis keşfi kapalı
eureka.client.enabled=false
spring.cloud.discovery.enabled=false