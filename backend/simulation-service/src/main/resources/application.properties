# Servisin Eureka'daki adı
spring.application.name=simulation-service

# Yerel çalışma adresi ve portu
server.address=127.0.0.1
server.port=8083

# Eureka bağlantısı
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Sağlık durumunu Eureka'ya yansıt
eureka.client.healthcheck.enabled=true

# Diğer servislerin erişeceği adres
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Sağlık ve bilgi adresleri
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info

# Yönetim endpoint'leri
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never