# Servisin Eureka'daki adı
spring.application.name=simulation-service

# Yerel çalışma adresi ve portu
server.address=127.0.0.1
server.port=8083

# Eureka bağlantısı
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Sağlık durumunu Eureka'ya yansıt
eureka.client.healthcheck.enabled=true

# Diğer servislerin erişeceği adres
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Sağlık ve bilgi adresleri
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info

# Yönetim endpoint'leri
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# PostgreSQL: postgres veritabanı, simulation_db şeması
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway: tablolar ve migration geçmişi aynı şemada
spring.flyway.enabled=true
spring.flyway.default-schema=simulation_db
spring.flyway.schemas=simulation_db
spring.flyway.create-schemas=true

# JPA kullanılırsa otomatik tablo değişikliğine izin verme
spring.jpa.hibernate.ddl-auto=validate

# PostgreSQL driver
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=simulation_db

# SQL sorgularini konsolda gosterir
spring.jpa.show_sql=true

# SQL ciktisini daha okunabilir hale getirir
spring.jpa.properties.hibernate.format_sql=true

# Hibernate'in PostgreSQL'e uygun SQL uretmesini saglar
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

