# PostgreSQL: aynı veritabanı, ayrı test şeması
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=reporting_test_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Test migration'ları yalnızca test şemasına uygulanır
spring.flyway.enabled=true
spring.flyway.default-schema=reporting_test_db
spring.flyway.schemas=reporting_test_db
spring.flyway.create-schemas=true

# Testlerde servis keşfi ve otomatik Kafka başlatma kapalı
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.kafka.listener.auto-startup=false

