# Servisin Eureka'da kullanılacak adı
spring.application.name=reporting-service

# Yerel çalışma adresi ve portu
server.address=127.0.0.1
server.port=8085

# Eureka sunucusunun adresi
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# Kendini kaydet ve diğer servislerin kayıtlarını al
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Sağlık durumunu Eureka kaydına yansıt
eureka.client.healthcheck.enabled=true

# Diğer yerel servislerin erişebileceği adresi duyur
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Sağlık ve bilgi adresleri
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info

# Dışarı sunulan yönetim endpoint'leri
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# PostgreSQL: postgres veritabanı, reporting_db şeması
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway: tablolar ve migration geçmişi aynı şemada
spring.flyway.enabled=true
spring.flyway.default-schema=reporting_db
spring.flyway.schemas=reporting_db
spring.flyway.create-schemas=true

# Kafka & Redis
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual_immediate
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=1s

# Identity JWKS doğrulaması
jwt.issuer=${JWT_ISSUER:http://localhost:8081}
jwt.audience=${JWT_AUDIENCE:cryptolab-api}
jwt.jwks-url=${JWT_JWKS_URL:http://localhost:8081/.well-known/jwks.json}
reporting.cursor-secret=${REPORTING_CURSOR_SECRET:cryptolab-reporting-cursor-hmac-secret-2026}
