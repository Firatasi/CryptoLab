spring.datasource.url=${STRATEGY_TEST_DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=strategy_test_db}
spring.datasource.username=${STRATEGY_TEST_DB_USERNAME:postgres}
spring.datasource.password=${STRATEGY_TEST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=strategy_test_db
spring.flyway.schemas=strategy_test_db
spring.flyway.create-schemas=true

eureka.client.enabled=false
spring.cloud.discovery.enabled=false