# Servisin Eureka'daki adı
spring.application.name=strategy-service

# Yerel çalışma adresi ve portu
server.address=127.0.0.1
server.port=8084

# Eureka bağlantısı
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Sağlık durumunu Eureka'ya yansıt
eureka.client.healthcheck.enabled=true

# Diğer servislerin erişeceği adres
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Sağlık ve bilgi adresleri
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info

# Yönetim endpoint'leri
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Strategy'nin yerel PostgreSQL bağlantısı
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=strategy_db}
spring.datasource.username=${DB_USERNAME:strategy_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Şema önceden DBA tarafından oluşturulur
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=strategy_db
spring.flyway.schemas=strategy_db
spring.flyway.create-schemas=false

# Identity tarafından imzalanan access token doğrulaması
jwt.issuer=${JWT_ISSUER:http://localhost:8081}
jwt.audience=${JWT_AUDIENCE:cryptolab-api}
jwt.jwks-url=${JWT_JWKS_URL:http://localhost:8081/.well-known/jwks.json}

# Multipart disk'e spool edilir; temp alanına kota/temizlik uygulanır.
# Gateway toplam body limitini metadata payı nedeniyle 21MB ile uyumlu tut.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
spring.servlet.multipart.file-size-threshold=0