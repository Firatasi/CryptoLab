# CryptoLab Production Reverse Proxy (Nginx) Security Configuration Template
# Deploy behind HTTPS/TLS termination; forward only gateway traffic and serve Vite `dist/` statically.

server_tokens off;

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_limit:20m rate=300r/m;

server {
    listen 443 ssl http2;
    server_name cryptolab.example.com;

    # TLS certificates managed via Certbot / Cloud LB / Vault
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/www/cryptolab/dist;
    index index.html;

    client_max_body_size 21m;

    # Standard HTTP Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Block hidden files, dotfiles, internal routes, and actuator endpoints
    location ~ /\. {
        return 404;
    }

    location ^~ /internal {
        return 403;
    }

    location ^~ /actuator {
        return 403;
    }

    # Strict rate-limit on authentication routes
    location ^~ /api/v1/auth/ {
        limit_req zone=auth_limit burst=15 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
    }

    # SSE real-time streams (disable buffering)
    location ~ ^/api/v1/(market|sim|strategy)/.+/stream$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # General API & JWKS proxy
    location ~ ^(/api/v1/|/\.well-known/jwks\.json$) {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Server;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
