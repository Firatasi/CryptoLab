name: Gemini AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Gemini PR Reviewer Çalıştır
        uses: rubensflinco/gemini-code-review-action@main
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          model: "gemini-2.5-flash"
          temperature: 0.2
          language: "tr" # İnceleme yorumlarını Türkçe yazar