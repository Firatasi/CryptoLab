name: "Gemini 3.8 Flash Code Review (PR & Commit Inline)"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - "**"

permissions:
  contents: write
  pull-requests: write

jobs:
  gemini-code-review:
    runs-on: ubuntu-latest
    steps:
      - name: Repo Kodunu Çek
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerekli Paketleri Yükle
        run: pip install google-genai requests

      - name: Gemini 3.8 Flash İle Satır İçi (Inline) Kod İncelemesi Yap
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          import re
          import subprocess
          import requests
          from google import genai
          from google.genai import types

          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]
          GITHUB_TOKEN = os.environ["GITHUB_TOKEN"]
          REPO = os.environ["GITHUB_REPOSITORY"]
          EVENT_NAME = os.environ.get("EVENT_NAME", "push")
          PR_NUMBER = os.environ.get("PR_NUMBER", "").strip()

          if EVENT_NAME == "pull_request" and PR_NUMBER:
              BASE_SHA = os.environ["PR_BASE_SHA"]
              HEAD_SHA = os.environ["PR_HEAD_SHA"]
          else:
              BASE_SHA = os.environ.get("PUSH_BEFORE_SHA", "")
              HEAD_SHA = os.environ.get("PUSH_AFTER_SHA", "HEAD")
              if not BASE_SHA or BASE_SHA == "0000000000000000000000000000000000000000":
                  BASE_SHA = f"{HEAD_SHA}~1"

          # 1. Diff çıktısını al ve satır numaralarını (RIGHT side) + diff pozisyonunu etiketle
          try:
              raw_diff = subprocess.check_output(
                  ["git", "diff", "--unified=3", BASE_SHA, HEAD_SHA],
                  text=True,
                  errors="replace",
              )
          except Exception:
              raw_diff = subprocess.check_output(
                  ["git", "show", "--format=", "--unified=3", HEAD_SHA],
                  text=True,
                  errors="replace",
              )

          if not raw_diff.strip():
              print("Değişiklik bulunamadı, inceleme atlanıyor.")
              raise SystemExit(0)

          valid_lines = {}
          annotated_diff_lines = []
          current_file = None
          new_line_num = None
          diff_position = 0

          for line in raw_diff.splitlines():
              if line.startswith("+++ b/"):
                  current_file = line[6:].strip()
                  diff_position = 0
                  annotated_diff_lines.append(line)
              elif line.startswith("@@ "):
                  m = re.search(r"\+(\d+)", line)
                  if m:
                      new_line_num = int(m.group(1))
                  diff_position += 1
                  annotated_diff_lines.append(line)
              elif current_file and new_line_num is not None:
                  if line.startswith("+") and not line.startswith("+++"):
                      diff_position += 1
                      valid_lines[(current_file, new_line_num)] = diff_position
                      annotated_diff_lines.append(f"[SATIR:{new_line_num}] {line}")
                      new_line_num += 1
                  elif line.startswith("-") and not line.startswith("---"):
                      diff_position += 1
                      annotated_diff_lines.append(line)
                  elif line.startswith(" "):
                      diff_position += 1
                      valid_lines[(current_file, new_line_num)] = diff_position
                      annotated_diff_lines.append(f"[SATIR:{new_line_num}] {line}")
                      new_line_num += 1
                  else:
                      annotated_diff_lines.append(line)
              else:
                  annotated_diff_lines.append(line)

          annotated_diff = "\n".join(annotated_diff_lines)[:120000]

          # 2. Gemini 3.8 Flash modelinden yapılandırılmış JSON incelemesi al
          client = genai.Client(api_key=GEMINI_API_KEY)

          prompt = f"""
          Sen Kıdemli bir Yazılım Mimarı ve Güvenlik Uzmanısın (Staff Engineer).
          Aşağıdaki kod değişikliklerini (git diff) incele. Diff içindeki `[SATIR:X]` etiketleri yeni dosyadaki gerçek satır numarasını gösterir.

          Lütfen tamamen TÜRKÇE olarak aşağıdaki JSON şemasında çıktı üret:
          {{
            "summary": "Bu değişikliğin ne yaptığını anlatan 1-2 cümlelik net özet.",
            "scores": {{
              "security": "🟢 Güvenli | 🟡 Dikkat | 🔴 Riskli (Kısa 3-5 kelimelik açıklama)",
              "performance": "🟢 İyi | 🟡 Orta | 🔴 Sorunlu (Kısa 3-5 kelimelik açıklama)",
              "maintainability": "🟢 Temiz | 🟡 Orta | 🔴 Karmaşık (Kısa 3-5 kelimelik açıklama)"
            }},
            "inline_comments": [
              {{
                "path": "dosya/yolu.uzanti",
                "line": 42,
                "severity": "🔴 Kritik | 🟡 Uyarı | 🔵 Öneri",
                "issue": "Sorunun veya hatanın ne olduğunu 1-2 cümlede net ve anlaşılır şekilde açıkla.",
                "suggestion_code": "Sadece o satırın yerine geçecek düzeltilmiş kod (eğer doğrudan kod önerisi varsa yaz, yoksa boş bırak)"
              }}
            ]
          }}

          KURALLAR:
          1. Boş laf kalabalığı yapma, sadece gerçek hatalar, güvenlik açıkları, performans kayıpları veya önemli temiz kod iyileştirmeleri için `inline_comments` ekle.
          2. `line` değeri kesinlikle diff içindeki `[SATIR:X]` numarasıyla eşleşmelidir.
          3. `suggestion_code` içine ``` işareti koyma, sadece saf kodu yaz.

          İNCELENECEK DIFF:
          {annotated_diff}
          """

          response = client.models.generate_content(
              model="gemini-3.8-flash",
              contents=prompt,
              config=types.GenerateContentConfig(
                  temperature=0.2,
                  response_mime_type="application/json",
              ),
          )

          data = json.loads(response.text)

          # 3. Üst Özet Tablosu (Scorecard) oluştur
          scores = data.get("scores", {})
          summary_md = (
              "## 🤖 Gemini 3.8 Flash Profesyonel Kod İnceleme Raporu\n\n"
              f"**Özet:** {data.get('summary', 'Kod değişiklikleri incelendi.')}\n\n"
              "| Kategori | Durum |\n"
              "| :--- | :--- |\n"
              f"| **🔒 Güvenlik** | {scores.get('security', '🟢 İncelendi')} |\n"
              f"| **⚡ Performans** | {scores.get('performance', '🟢 İncelendi')} |\n"
              f"| **🧹 Kod Kalitesi** | {scores.get('maintainability', '🟢 İncelendi')} |\n"
          )

          gh_pr_comments = []
          gh_commit_comments = []
          fallback_comments = []

          for c in data.get("inline_comments", []):
              path = c.get("path", "")
              line_no = int(c.get("line", 0))
              severity = c.get("severity", "🟡 Uyarı")
              issue = c.get("issue", "")
              suggestion_code = (c.get("suggestion_code") or "").strip()

              comment_body = f"**{severity}**\n\n{issue}"
              if suggestion_code:
                  comment_body += f"\n\n```suggestion\n{suggestion_code}\n```"

              if (path, line_no) in valid_lines:
                  gh_pr_comments.append({
                      "path": path,
                      "line": line_no,
                      "side": "RIGHT",
                      "body": comment_body,
                  })
                  gh_commit_comments.append({
                      "path": path,
                      "position": valid_lines[(path, line_no)],
                      "body": comment_body,
                  })
              else:
                  fallback_comments.append(
                      f"- **`{path}` (Satır {line_no}) — {severity}:** {issue}"
                      + (f"\n  ```\n  {suggestion_code}\n  ```" if suggestion_code else "")
                  )

          if fallback_comments:
              summary_md += "\n### 📌 Satır Bulguları\n" + "\n".join(fallback_comments)
          elif not gh_pr_comments:
              summary_md += "\n✅ **Herhangi bir kritik hata veya güvenlik açığı tespit edilmedi. Kod temiz görünüyor!**"

          # GitHub Actions özet ekranına da bas
          step_summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if step_summary_path:
              with open(step_summary_path, "a", encoding="utf-8") as sf:
                  sf.write(summary_md + "\n")

          headers = {
              "Authorization": f"Bearer {GITHUB_TOKEN}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          # 4A. Eğer Pull Request ise doğrudan PR altına ve satırlarına bas
          if EVENT_NAME == "pull_request" and PR_NUMBER:
              url = f"https://api.github.com/repos/{REPO}/pulls/{PR_NUMBER}/reviews"
              payload = {
                  "commit_id": HEAD_SHA,
                  "body": summary_md,
                  "event": "COMMENT",
                  "comments": gh_pr_comments,
              }
              res = requests.post(url, headers=headers, json=payload)
              if res.status_code >= 300:
                  payload.pop("comments", None)
                  requests.post(url, headers=headers, json=payload)
          # 4B. Doğrudan Commit (push) atıldıysa doğrudan Commit sayfasının ve satırlarının altına yorum bas
          else:
              commit_url = f"https://api.github.com/repos/{REPO}/commits/{HEAD_SHA}/comments"
              requests.post(commit_url, headers=headers, json={"body": summary_md})
              for cc in gh_commit_comments:
                  requests.post(commit_url, headers=headers, json=cc)
          EOF