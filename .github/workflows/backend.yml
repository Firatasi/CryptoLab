name: backend
on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - 'contracts/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'contracts/**'
      - '.github/workflows/backend.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_USERNAME: postgres
      DB_PASSWORD: test
      STRATEGY_TEST_DB_USERNAME: postgres
      STRATEGY_TEST_DB_PASSWORD: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r contracts/requirements.txt
      - run: python contracts/check_contracts.py
      # Testcontainers runner Docker'ını kullanır; servis veya yerel postgres üzerinde çalışır
      - run: mvn -B -f backend/pom.xml clean verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            backend/**/target/surefire-reports/**
            backend/**/target/failsafe-reports/**
# Release öncesinde action tag'lerini doğrulanmış commit SHA'larına pinle.
